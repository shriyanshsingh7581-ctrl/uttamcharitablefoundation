    <script>
      // Global safety guard to prevent ReferenceError: Network is not defined
      if (typeof window !== 'undefined' && typeof window.Network === 'undefined') {
        window.Network = {
          getStatus: function() {
            return Promise.resolve({
              connected: typeof navigator !== 'undefined' ? navigator.onLine : true,
              connectionType: 'wifi'
            });
          },
          addListener: function() { return { remove: function() {} }; },
          removeAllListeners: function() {}
        };
      }
    </script>
